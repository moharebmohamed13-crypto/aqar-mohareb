<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>عقار محارب | شاليهات للبيع والإيجار</title>
<meta name="description" content="عقار محارب — اختار قريتك وشاليهك، وشوف الأيام المتاحة واحجز بسهولة.">
<meta name="theme-color" content="#1A1A1A">
<link rel="icon" href="logo-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=El+Messiri:wght@500;600&family=IBM+Plex+Sans+Arabic:wght@400;500;600&family=Poppins:wght@500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="app.css?v=10">
</head>
<body>
<header id="bar" class="bar"></header>
<main>
  <section class="hero hero-lite" aria-labelledby="h">
    <img class="hero-bg am-zoom" id="hero-bg" alt="">
    <div class="wrap">
      <div>
        <h1 class="am-up" id="h">اختار شاليهك<br>على البحر</h1>
        <p class="am-up am-d1" id="hero-sub">بيع وإيجار شاليهات في مكان واحد.</p>
      </div>
      <form class="sbar am-up am-d2" id="search" aria-label="بحث">
        <label class="sf">
          <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 21s-7-6.2-7-11.5A7 7 0 0 1 19 9.5C19 14.8 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.5"/></svg>
          <select name="v" aria-label="القرية"><option value="">اختر القرية</option></select><svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg>
        </label>
        <label class="sf">
          <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 8h13l-3-3M20 16H7l3 3"/></svg>
          <select name="o" aria-label="نوع العملية"><option value="">بيع أو إيجار</option><option value="rent">إيجار</option><option value="sale">بيع</option></select><svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg>
        </label>
        <button class="sgo am-cta" type="submit">
          <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg>بحث
        </button>
      </form>
    </div>
  </section>

  <section class="sec wrap" id="villages-sec" aria-labelledby="vh">
    <div class="vhead">
      <span class="line"></span>
      <h2 class="h2" id="vh">اختر قريتك</h2>
      <p>اكتشف القرى واستعرض الشاليهات المتاحة.</p>
    </div>
    <div class="vgrid am-list" id="villages"><div class="skel"></div><div class="skel"></div><div class="skel"></div><div class="skel"></div></div>
    <button class="more-btn" type="button" id="more" hidden>عرض جميع القرى <svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg></button>
  </section>
</main>
<footer id="contact"></footer>
<script type="module" src="home.js?v=10"></script>
</body>
</html>
